<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>漢字4択クイズ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <h1>🌟 漢字4択クイズ</h1>
        <p>明るく楽しく、感覚的に学べる漢字クイズ！</p>
      </header>

      <section class="controls card">
        <label for="level">レベルを選ぶ</label>
        <select id="level" aria-label="漢字レベル選択"></select>
        <button id="startBtn" class="btn primary">クイズ開始</button>
      </section>

      <section id="quizPanel" class="quiz card hidden" aria-live="polite">
        <div class="quiz-meta">
          <span id="progress"></span>
          <span id="score"></span>
        </div>
        <h2 id="question"></h2>
        <div id="choices" class="choices"></div>
        <div id="result" class="result"></div>
        <button id="nextBtn" class="btn hidden">次の問題へ</button>
      </section>

      <section id="finishPanel" class="card hidden">
        <h2>おつかれさま！</h2>
        <p id="finalScore"></p>
        <button id="retryBtn" class="btn primary">もう一度挑戦</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
